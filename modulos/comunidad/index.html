<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sa-zón · Célula 6 · Comunidad y Valoraciones (HU 6.2.1)</title>
  <!-- Bootstrap 5.3.3 y Fuentes Oficiales de Sa-zón -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Enlace al archivo CSS separado que vas a crear -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container py-4">
    <!-- Encabezado de la Célula 6 -->
    <header class="comunidad-page-header mb-4">
      <div>
        <span class="comunidad-tag-celula">CÉLULA 6 · COMUNIDAD Y VALORACIONES</span>
        <h1 class="comunidad-titulo-principal">Listado de Comentarios y Reseñas</h1>
        <p class="comunidad-subtitulo mb-0">
          Historia de Usuario 6.2.1 · Rama: <code>feature/comunidad/G6-COM-F01-listado</code>
        </p>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <select id="selector-receta" class="form-select form-select-sm comunidad-select" aria-label="Seleccionar receta">
          <option value="128">Receta #128: Pasta cremosa con Ranchera</option>
          <option value="999">Receta #999: Simular error de API (try/catch)</option>
        </select>
        <button type="button" id="btn-recargar" class="btn btn-sm btn-sazon-lima">
          Recargar comentarios
        </button>
      </div>
    </header>

    <!-- Marco .app-frame de la Célula 6 en Sa-zón -->
    <section class="app-frame" aria-label="Vista de comentarios de la comunidad">
      <div class="app-bar">
        <span id="app-bar-url">sazon.app/recetas/128/comentarios</span>
        <span id="estado-servicio-badge" class="badge bg-success-subtle text-success border">API Fetch Activa</span>
      </div>

      <div class="app-screen">
        <!-- Cabecera de la receta -->
        <header class="comunidad-receta-header mb-3">
          <div class="avatar-placeholder" aria-hidden="true">🍝</div>
          <div>
            <h2 class="h6 mb-0 fw-bold" id="receta-titulo">Pasta cremosa con Ranchera</h2>
            <div class="small">
              <span class="mk-star" id="receta-estrellas">★★★★★</span>
              <span class="text-muted" id="receta-resumen-texto">4.6 · 48 valoraciones</span>
            </div>
          </div>
          <button type="button" id="btn-guardar-receta" class="btn btn-sm btn-success rounded-pill ms-auto">
            💚 Guardar
          </button>
        </header>

        <!-- Mensaje de error (se activa solo si falla el try/catch) -->
        <div id="comunidad-alerta-error" class="comunidad-alerta-error" role="alert" hidden></div>

        <!-- Contenedor semántico donde app.js inyecta las tarjetas .comunidad-comentario-card -->
        <section
          id="comunidad-lista-comentarios"
          class="comunidad-comentarios-grid"
          aria-live="polite"
          aria-label="Reseñas de usuarios"
        ></section>

        <!-- Acciones inferiores del prototipo de Célula 6 -->
        <footer class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top flex-wrap gap-2">
          <button type="button" id="btn-coleccion" class="btn btn-sm btn-outline-dark rounded-pill">
            💼 Agregar a colección
          </button>
          <button type="button" id="btn-reportar" class="btn btn-link btn-sm text-muted text-decoration-none p-0">
            🚩 Reportar
          </button>
        </footer>
      </div>
    </section>
  </main>

  <!-- Enlace al archivo JavaScript separado -->
  <script src="app.js"></script>
</body>
</html>
