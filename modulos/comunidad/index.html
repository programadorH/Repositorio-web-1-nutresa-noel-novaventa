<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sazón · Comunidad – Comentarios con fotos</title>

  <!-- Mismas librerías y fuentes que https://sazon-ten.vercel.app -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- ===================== INICIO ZONA ESTUDIANTE · G6-COM-F03 ===================== -->
  <main class="container py-5" id="g6-com-f03">

    <span class="eyebrow">Célula 6 · Comunidad y Valoraciones</span>
    <h1 class="mb-1">Comentarios con foto del resultado</h1>
    <p class="text-secondary mb-4">Comparte cómo te quedó el plato preparado con productos Nutresa.</p>

    <div class="row g-4">
      <!-- Formulario -->
      <div class="col-lg-5">
        <form id="formComentario" class="g6-card p-4" novalidate>
          <h2 class="h5 mb-3"><i class="bi bi-chat-square-heart"></i> Deja tu comentario</h2>

          <div class="mb-3">
            <label for="inputNombre" class="form-label">Tu nombre</label>
            <input type="text" id="inputNombre" class="form-control" maxlength="60" required>
          </div>

          <div class="mb-3">
            <label for="inputComentario" class="form-label">Comentario</label>
            <textarea id="inputComentario" class="form-control" rows="3" maxlength="500" required></textarea>
          </div>

          <div class="mb-3">
            <label for="inputFoto" class="form-label">Foto del plato <small class="text-secondary">(JPG, PNG o WEBP · máx. 2 MB)</small></label>
            <input type="file" id="inputFoto" class="form-control" accept="image/jpeg,image/png,image/webp">
            <div class="invalid-feedback" id="errorFoto">Formato no válido.</div>
          </div>

          <!-- Vista previa -->
          <div id="previewWrap" class="g6-preview mb-3 d-none">
            <img id="previewImg" alt="Vista previa de la foto">
            <button type="button" id="btnQuitarFoto" class="btn btn-sm btn-blanco" title="Quitar foto">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <button type="submit" id="btnPublicar" class="btn btn-lima w-100">
            <i class="bi bi-send"></i> Publicar comentario
          </button>
          <div id="mensajeEstado" class="small mt-2"></div>
        </form>
      </div>

      <!-- Listado -->
      <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 m-0">Comentarios publicados</h2>
          <button id="btnCargar" class="btn btn-outline-tinta btn-sm">
            <i class="bi bi-arrow-clockwise"></i> Cargar comentarios
          </button>
        </div>
        <section id="sectionDatos" class="d-grid gap-3"></section>
      </div>
    </div>
  </main>
  <!-- ====================== FIN ZONA ESTUDIANTE · G6-COM-F03 ====================== -->

  <script src="app.js"></script>
</body>
</html>
